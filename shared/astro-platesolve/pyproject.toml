[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-platesolve"
version = "0.1.0"
description = "Shared local plate-solving backends for Siril scripts and SPACER"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "astropy"]

[tool.setuptools.packages.find]
include = ["astro_platesolve*"]
